{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Activate Account | Savouré</title>

<link rel="stylesheet"
      href="{% static 'css/activate_account.css' %}">

</head>

<body>


<main class="activation-page">

    <div class="activation-card">

        <div class="brand">
            SAVOURÉ
        </div>

        <div class="header">

            <p class="eyebrow">
                STAFF ACCOUNT
            </p>

            <h1>
                Activate Your Account
            </h1>

            <p class="intro">
                Create a password to activate your staff account
                and gain access to the restaurant management system.
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-fields">

                {{ form.as_p }}

            </div>

            <button type="submit">
                Activate Account
            </button>

        </form>

        <p class="footer-note">
            Savouré Restaurant Management System
        </p>

    </div>

</main>


</body>

</html>
