{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>{{ title }} | Savouré</title>

<link rel="stylesheet" href="{% static 'css/manager_menu.css' %}">


</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <a href="{% url 'manager-dashboard' %}"
       class="logo">

        SAVOUR<span>É</span>

    </a>


    <div class="nav-links">

        <a href="{% url 'manager-dashboard' %}">
            Dashboard
        </a>


        <a href="{% url 'manager-staff-list' %}">
            Staff
        </a>


        <a href="{% url 'manager-menu' %}">
            Menu
        </a>


        <a href="{% url 'logout' %}"
           class="logout-button">

            Logout

        </a>

    </div>

</nav>



<!-- MAIN CONTENT -->

<main class="form-container">


    <section class="form-card">


        <div class="form-heading">

            <p class="small-heading">
                MENU
            </p>


            <h1>
                {{ title }}
            </h1>


            <p>
                Add or update a restaurant menu item.
            </p>

        </div>



        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}


            {{ form.as_p }}


            <div class="form-actions">

                <button type="submit"
                        class="save-button">

                    Save Menu Item

                </button>


                <a href="{% url 'manager-menu' %}"
                   class="cancel-button">

                    Cancel

                </a>

            </div>

        </form>


    </section>


</main>



<!-- FOOTER -->

<footer class="footer">

    <div class="footer-content">

        <div>

            <div class="footer-logo">

                SAVOUR<span>É</span>

            </div>


            <p>
                Restaurant management made simple.
            </p>

        </div>


        <div class="footer-right">

            <p>
                Manager Portal
            </p>


            <p>
                © 2026 Savouré
            </p>

        </div>

    </div>

</footer>


</body>

</html>
